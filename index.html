<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuro Nest — Mind Operating System</title>
<style>
:root{
  --bg:#0a0a12; --bg2:#0d0d17;
  --card:#12121e; --card2:#171726;
  --border:rgba(255,255,255,.075); --border2:rgba(255,255,255,.14);
  --text:#edeaf8; --muted:#9a97b8; --faint:#6d6a8a;
  --accent:#8b5cf6; --accent2:#6366f1; --accent-soft:rgba(139,92,246,.16);
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#38bdf8;
  --radius:20px; --radius-sm:13px;
  --grad:linear-gradient(135deg,#8b5cf6,#6366f1);
  --shadow:0 10px 34px rgba(0,0,0,.45);
}
html{ -webkit-text-size-adjust:100%; }
html.font-lg{ font-size:18px; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
  font-size:15px; line-height:1.55; color:var(--text);
  background:
    radial-gradient(1100px 700px at 85% -10%, rgba(139,92,246,.13), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(99,102,241,.10), transparent 60%),
    var(--bg);
  min-height:100vh;
}
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.13); border-radius:99px; }
::-webkit-scrollbar-track{ background:transparent; }
a{ color:var(--accent); text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input,select,textarea{ font:inherit; color:var(--text); }
img,svg{ display:block; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

/* ---------- App shell ---------- */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:258px; flex:0 0 258px; position:sticky; top:0; height:100vh; overflow-y:auto;
  background:rgba(13,13,23,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 14px; z-index:60;
}
.brand{ display:flex; align-items:center; gap:11px; padding:4px 8px 18px; }
.brand-mark{ width:40px; height:40px; border-radius:12px; background:var(--grad); display:grid; place-items:center; box-shadow:0 6px 20px rgba(139,92,246,.4); flex:0 0 40px; }
.brand-name{ font-weight:800; letter-spacing:.14em; font-size:.95rem; }
.brand-sub{ font-size:.58rem; letter-spacing:.24em; color:var(--muted); font-weight:600; margin-top:1px; }
nav.side-nav{ display:flex; flex-direction:column; gap:3px; flex:1; }
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:12px;
  color:var(--muted); font-weight:550; font-size:.92rem; text-align:left; width:100%;
  transition:background .18s, color .18s; position:relative;
}
.nav-item svg{ width:19px; height:19px; flex:0 0 19px; opacity:.85; }
.nav-item:hover{ background:rgba(255,255,255,.05); color:var(--text); }
.nav-item.active{ background:var(--accent-soft); color:#c4b0ff; }
.nav-item.active::before{ content:""; position:absolute; left:-14px; top:20%; bottom:20%; width:3px; border-radius:99px; background:var(--grad); }
.nav-badge{ font-size:.56rem; font-weight:800; letter-spacing:.08em; background:var(--grad); color:#fff; padding:2px 7px; border-radius:99px; margin-left:auto; }
.side-foot{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.upgrade-btn{
  display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 12px; border-radius:13px;
  background:var(--grad); color:#fff; font-weight:650; font-size:.88rem; width:100%;
  box-shadow:0 8px 22px rgba(139,92,246,.35); transition:transform .18s, box-shadow .18s;
}
.upgrade-btn:hover{ transform:translateY(-1px); box-shadow:0 10px 26px rgba(139,92,246,.5); }
.user-chip{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:14px; background:var(--card); border:1px solid var(--border); width:100%; text-align:left; }
.user-chip .u-name{ font-weight:650; font-size:.85rem; }
.user-chip .u-plan{ font-size:.66rem; color:var(--muted); font-weight:700; letter-spacing:.08em; }
.avatar{
  width:36px; height:36px; border-radius:11px; background:var(--grad); color:#fff; font-weight:750; font-size:.8rem;
  display:grid; place-items:center; flex:0 0 36px; border:none;
}
.backdrop{ display:none; }

.main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
  padding:13px 26px; background:rgba(10,10,18,.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.hamburger{ display:none; width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--card); align-items:center; justify-content:center; }
.hamburger svg{ width:18px; height:18px; }
.tb-titles{ min-width:0; }
.tb-titles h1{ font-size:1.05rem; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tb-titles p{ font-size:.74rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
.tb-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.pill{
  display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:99px; font-size:.78rem; font-weight:650;
  background:var(--card); border:1px solid var(--border); color:var(--text); white-space:nowrap;
}
.pill .ico{ width:15px; height:15px; }
.pill-focus{ border-color:rgba(139,92,246,.5); background:var(--accent-soft); cursor:pointer; }
.pill .live-dot{ width:7px; height:7px; border-radius:99px; background:var(--good); animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.4; transform:scale(.8);} }
.tb-avatar{ width:38px; height:38px; border-radius:11px; padding:0; }

.content{ flex:1; width:100%; max-width:1180px; margin:0 auto; padding:26px 26px 60px; }
.page{ display:none; }
.page.active{ display:block; animation:fadeUp .38s ease both; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
@keyframes popIn{ from{ opacity:0; transform:scale(.94);} to{ opacity:1; transform:scale(1);} }

/* ---------- Layout helpers ---------- */
.grid{ display:grid; gap:16px; }
.g2{ grid-template-columns:repeat(2,1fr); }
.g3{ grid-template-columns:repeat(3,1fr); }
.g4{ grid-template-columns:repeat(4,1fr); }
.g23{ grid-template-columns:2fr 1fr; }
.g32{ grid-template-columns:1fr 2fr; }
.row{ display:flex; align-items:center; gap:10px; }
.row.wrap{ flex-wrap:wrap; }
.spread{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.mt{ margin-top:16px; } .mt2{ margin-top:24px; }
.muted{ color:var(--muted); } .small{ font-size:.8rem; } .tiny{ font-size:.7rem; }
.center{ text-align:center; }
.stack{ display:flex; flex-direction:column; gap:8px; }

/* ---------- Cards ---------- */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.024), rgba(255,255,255,0) 40%), var(--card);
  border:1px solid var(--border); border-radius:var(--radius); padding:20px; position:relative;
}
.card-title{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:.95rem; margin-bottom:4px; }
.card-title svg{ width:17px; height:17px; color:var(--accent); }
.card-sub{ color:var(--muted); font-size:.8rem; margin-bottom:14px; }
.hero{
  border-radius:24px; padding:30px; border:1px solid rgba(139,92,246,.35); position:relative; overflow:hidden;
  background:
    radial-gradient(500px 260px at 90% -30%, rgba(139,92,246,.28), transparent 60%),
    radial-gradient(400px 240px at -10% 130%, rgba(99,102,241,.18), transparent 60%),
    var(--card);
}
.hero h2{ font-size:1.65rem; font-weight:800; letter-spacing:-.01em; }
.hero .hero-sub{ color:#c6c2e4; margin:8px 0 20px; max-width:640px; font-size:.95rem; }
.hero-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.hero-deco{ position:absolute; right:26px; top:50%; transform:translateY(-50%); opacity:.9; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:13px;
  font-weight:650; font-size:.88rem; transition:transform .16s, box-shadow .16s, background .16s, border-color .16s;
  border:1px solid transparent;
}
.btn svg{ width:16px; height:16px; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--grad); color:#fff; box-shadow:0 8px 22px rgba(139,92,246,.35); }
.btn-primary:hover{ box-shadow:0 10px 28px rgba(139,92,246,.5); transform:translateY(-1px); }
.btn-ghost{ background:rgba(255,255,255,.05); border-color:var(--border2); color:var(--text); }
.btn-ghost:hover{ background:rgba(255,255,255,.09); }
.btn-soft{ background:var(--accent-soft); color:#c4b0ff; border-color:rgba(139,92,246,.3); }
.btn-soft:hover{ background:rgba(139,92,246,.25); }
.btn-danger{ background:rgba(248,113,113,.12); color:var(--bad); border-color:rgba(248,113,113,.3); }
.btn-sm{ padding:7px 13px; font-size:.8rem; border-radius:10px; }
.btn-block{ width:100%; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none!important; }

/* ---------- Stats ---------- */
.stat-card{ text-align:center; padding:20px 14px; }
.stat-num{ font-size:1.9rem; font-weight:800; letter-spacing:-.02em; }
.stat-label{ color:var(--muted); font-size:.78rem; font-weight:600; margin-top:2px; }
.stat-ico{ font-size:1.3rem; margin-bottom:6px; }
.gauge{ position:relative; display:grid; place-items:center; }
.gauge svg{ transform:rotate(-90deg); }
.gauge .g-label{ position:absolute; text-align:center; }
.delta-up{ color:var(--good); font-weight:700; }
.delta-down{ color:var(--bad); font-weight:700; }

/* ---------- Chips / badges ---------- */
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:99px; font-size:.78rem; font-weight:600;
  background:rgba(255,255,255,.05); border:1px solid var(--border); color:var(--muted);
  transition:all .16s; cursor:pointer;
}
.chip:hover{ border-color:var(--border2); color:var(--text); }
.chip.on{ background:var(--accent-soft); border-color:rgba(139,92,246,.45); color:#c9b6ff; }
.badge{ font-size:.62rem; font-weight:800; letter-spacing:.08em; padding:3px 9px; border-radius:99px; }
.badge-green{ background:rgba(52,211,153,.14); color:var(--good); }
.badge-amber{ background:rgba(251,191,36,.14); color:var(--warn); }
.badge-red{ background:rgba(248,113,113,.14); color:var(--bad); }
.badge-purple{ background:var(--accent-soft); color:#c4b0ff; }
.badge-grad{ background:var(--grad); color:#fff; }
.dot{ width:8px; height:8px; border-radius:99px; display:inline-block; }
.dot-green{ background:var(--good); box-shadow:0 0 0 0 rgba(52,211,153,.5); animation:dotPulse 2s infinite; }
.dot-amber{ background:var(--warn); }
@keyframes dotPulse{ 0%{ box-shadow:0 0 0 0 rgba(52,211,153,.45);} 70%{ box-shadow:0 0 0 7px rgba(52,211,153,0);} 100%{ box-shadow:0 0 0 0 rgba(52,211,153,0);} }

/* ---------- Chat ---------- */
.chat-wrap{ display:flex; flex-direction:column; height:calc(100vh - 175px); min-height:440px; }
.chat-scroll{ flex:1; overflow-y:auto; padding:6px 4px 16px; display:flex; flex-direction:column; gap:14px; }
.msg{ display:flex; gap:11px; max-width:82%; animation:fadeUp .3s ease both; }
.msg.user{ margin-left:auto; flex-direction:row-reverse; }
.msg .m-ava{ width:34px; height:34px; border-radius:11px; flex:0 0 34px; display:grid; place-items:center; background:var(--grad); color:#fff; }
.msg.user .m-ava{ background:rgba(255,255,255,.09); border:1px solid var(--border2); color:#c4b0ff; }
.m-bubble{ background:var(--card2); border:1px solid var(--border); border-radius:16px; padding:12px 15px; font-size:.9rem; }
.msg.user .m-bubble{ background:linear-gradient(135deg, rgba(139,92,246,.32), rgba(99,102,241,.25)); border-color:rgba(139,92,246,.4); }
.m-time{ font-size:.64rem; color:var(--faint); margin-top:5px; }
.m-sug{ display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.m-sug .chip{ font-size:.73rem; padding:6px 11px; }
.crisis-box{ border:1px solid rgba(248,113,113,.4); background:rgba(248,113,113,.07); border-radius:13px; padding:12px 14px; margin-top:10px; font-size:.84rem; }
.crisis-box b{ color:#fda4a4; }
.typing{ display:inline-flex; gap:4px; padding:14px 16px; }
.typing i{ width:7px; height:7px; border-radius:99px; background:var(--muted); animation:tb 1.2s infinite; }
.typing i:nth-child(2){ animation-delay:.18s; } .typing i:nth-child(3){ animation-delay:.36s; }
@keyframes tb{ 0%,60%,100%{ transform:translateY(0); opacity:.4;} 30%{ transform:translateY(-5px); opacity:1;} }
.chat-inputbar{ display:flex; gap:10px; align-items:center; padding-top:12px; border-top:1px solid var(--border); margin-top:6px; }
.chat-input{
  flex:1; background:var(--card2); border:1px solid var(--border2); border-radius:14px; padding:12px 15px;
  font-size:.9rem; outline:none; transition:border-color .16s;
}
.chat-input:focus{ border-color:rgba(139,92,246,.6); }
.send-btn{ width:44px; height:44px; border-radius:13px; background:var(--grad); color:#fff; display:grid; place-items:center; box-shadow:0 8px 20px rgba(139,92,246,.35); flex:0 0 44px; }
.send-btn svg{ width:18px; height:18px; }
.usage-chip{ font-size:.68rem; color:var(--muted); font-weight:600; }

/* ---------- Focus ---------- */
.seg{ display:inline-flex; background:var(--card2); border:1px solid var(--border); border-radius:13px; padding:4px; gap:4px; }
.seg button{ padding:8px 16px; border-radius:10px; font-size:.82rem; font-weight:650; color:var(--muted); transition:all .16s; }
.seg button.on{ background:var(--grad); color:#fff; box-shadow:0 4px 14px rgba(139,92,246,.4); }
.timer-box{ display:flex; flex-direction:column; align-items:center; gap:18px; padding:12px 0 4px; }
.timer-ring{ position:relative; width:264px; height:264px; }
.timer-ring svg{ transform:rotate(-90deg); }
.timer-text{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.timer-text .t-time{ font-size:3rem; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.timer-text .t-state{ color:var(--muted); font-size:.75rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
.sound-grid{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
.sound-chip{
  display:flex; align-items:center; gap:8px; padding:9px 15px; border-radius:12px; border:1px solid var(--border);
  background:var(--card2); font-size:.82rem; font-weight:600; color:var(--muted); transition:all .16s;
}
.sound-chip:hover{ color:var(--text); border-color:var(--border2); }
.sound-chip.on{ background:var(--accent-soft); border-color:rgba(139,92,246,.5); color:#c9b6ff; }
.sound-chip svg{ width:15px; height:15px; }
input[type=range]{ -webkit-appearance:none; appearance:none; height:5px; border-radius:99px; background:rgba(255,255,255,.14); outline:none; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:99px; background:var(--accent); border:2.5px solid #fff2; cursor:pointer; box-shadow:0 2px 10px rgba(139,92,246,.5); }

/* ---------- Games ---------- */
.game-card{ display:flex; flex-direction:column; gap:10px; }
.game-card .g-ico{ width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:var(--accent-soft); color:#c4b0ff; }
.game-card .g-ico svg{ width:23px; height:23px; }
.game-lvl{ display:inline-flex; }
.locked-ribbon{ display:inline-flex; align-items:center; gap:5px; color:var(--faint); font-size:.74rem; font-weight:700; }
.mm-grid{ display:grid; gap:9px; margin:0 auto; width:min(100%,380px); }
.mm-tile{
  aspect-ratio:1; border-radius:13px; background:var(--card2); border:1px solid var(--border);
  transition:background .15s, transform .15s, border-color .15s;
}
.mm-tile:hover{ border-color:var(--border2); }
.mm-tile.lit{ background:var(--grad); border-color:transparent; box-shadow:0 0 18px rgba(139,92,246,.5); }
.mm-tile.ok{ background:rgba(52,211,153,.75); border-color:transparent; }
.mm-tile.bad{ background:rgba(248,113,113,.75); border-color:transparent; animation:shake .3s; }
@keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-5px);} 75%{ transform:translateX(5px);} }
.ft-arena{ position:relative; height:330px; border-radius:16px; background:var(--bg2); border:1px solid var(--border); overflow:hidden; cursor:crosshair; }
.ft-target{
  position:absolute; width:46px; height:46px; border-radius:99px; background:var(--grad); cursor:pointer;
  box-shadow:0 0 24px rgba(139,92,246,.65); transition:left .5s ease, top .5s ease; display:grid; place-items:center; color:#fff;
}
.lc-seq{ font-size:1.5rem; font-weight:800; letter-spacing:.14em; text-align:center; padding:18px; border-radius:14px; background:var(--bg2); border:1px solid var(--border); font-variant-numeric:tabular-nums; }
.lc-opts{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.lc-opt{ padding:15px; border-radius:13px; background:var(--card2); border:1px solid var(--border); font-size:1.15rem; font-weight:750; transition:all .15s; }
.lc-opt:hover{ border-color:var(--border2); }
.lc-opt.right{ background:rgba(52,211,153,.22); border-color:rgba(52,211,153,.55); }
.lc-opt.wrong{ background:rgba(248,113,113,.22); border-color:rgba(248,113,113,.55); }
.sp-grid{ display:grid; gap:8px; margin:0 auto; width:min(100%,360px); }
.sp-cell{ aspect-ratio:1; border-radius:11px; cursor:pointer; }

/* ---------- Therapy ---------- */
.doc-card{ display:flex; flex-direction:column; gap:13px; }
.doc-head{ display:flex; gap:13px; align-items:center; }
.doc-ava{ width:50px; height:50px; border-radius:15px; display:grid; place-items:center; font-weight:800; font-size:.95rem; color:#fff; flex:0 0 50px; }
.doc-name{ font-weight:750; font-size:1rem; }
.doc-cred{ font-size:.72rem; color:var(--muted); }
.doc-meta{ display:flex; flex-wrap:wrap; gap:7px; }
.star{ color:var(--warn); }
.fee{ font-weight:800; font-size:1.05rem; }
.fee .fee-old{ color:var(--faint); text-decoration:line-through; font-weight:500; font-size:.8rem; margin-right:6px; }
.slot-chips{ display:flex; flex-wrap:wrap; gap:8px; }
textarea, .txt{
  width:100%; background:var(--card2); border:1px solid var(--border2); border-radius:13px; padding:11px 13px;
  font-size:.88rem; outline:none; resize:vertical; transition:border-color .16s;
}
textarea:focus, .txt:focus{ border-color:rgba(139,92,246,.6); }
label.fld{ display:block; font-size:.72rem; font-weight:700; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; margin:0 0 6px; }

/* ---------- Analytics ---------- */
.chart-wrap{ width:100%; overflow:hidden; }
.chart-wrap svg{ width:100%; height:auto; }
.heat-grid{ display:grid; grid-template-columns:44px repeat(6,1fr); gap:5px; align-items:center; }
.heat-cell{ aspect-ratio:1.6; border-radius:7px; background:rgba(255,255,255,.05); }
.heat-day{ font-size:.68rem; color:var(--muted); font-weight:700; text-align:right; padding-right:4px; }
.heat-col{ font-size:.6rem; color:var(--faint); text-align:center; }
.legend{ display:flex; align-items:center; gap:5px; font-size:.68rem; color:var(--muted); }
.legend i{ width:14px; height:10px; border-radius:3px; display:inline-block; }
.insight{ display:flex; gap:11px; padding:13px 15px; border-radius:14px; background:var(--bg2); border:1px solid var(--border); font-size:.86rem; }
.insight .i-ico{ flex:0 0 34px; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); font-size:1rem; }
.emobar{ display:flex; align-items:center; gap:10px; font-size:.8rem; }
.emobar .eb-track{ flex:1; height:9px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; }
.emobar .eb-fill{ height:100%; border-radius:99px; }

/* ---------- Preventive ---------- */
.gauge-card{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:20px 12px; }
.gauge-card .g-title{ font-size:.8rem; font-weight:700; color:var(--muted); }
.gauge-card .g-status{ font-size:.72rem; font-weight:800; letter-spacing:.06em; }
.alert-item{ display:flex; gap:13px; padding:15px; border-radius:15px; background:var(--bg2); border:1px solid var(--border); }
.alert-item .a-dot{ width:10px; height:10px; border-radius:99px; margin-top:5px; flex:0 0 10px; }

/* ---------- Toggles ---------- */
.toggle-row{ display:flex; align-items:center; gap:14px; padding:16px; border-radius:15px; background:var(--bg2); border:1px solid var(--border); }
.toggle-row .t-ico{ width:40px; height:40px; border-radius:12px; background:var(--accent-soft); display:grid; place-items:center; font-size:1.1rem; flex:0 0 40px; }
.t-title{ font-weight:700; font-size:.92rem; }
.t-desc{ color:var(--muted); font-size:.78rem; }
.switch{ margin-left:auto; position:relative; width:46px; height:26px; flex:0 0 46px; }
.switch input{ position:absolute; opacity:0; width:100%; height:100%; cursor:pointer; margin:0; z-index:2; }
.switch .sl{ position:absolute; inset:0; border-radius:99px; background:rgba(255,255,255,.12); transition:background .2s; }
.switch .sl::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:99px; background:#fff; transition:transform .2s; }
.switch input:checked + .sl{ background:var(--grad); }
.switch input:checked + .sl::after{ transform:translateX(20px); }

/* ---------- Settings / forms ---------- */
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.field{ margin-bottom:2px; }
.select-wrap{ position:relative; }
select.txt{ -webkit-appearance:none; appearance:none; padding-right:34px; }
.select-wrap::after{ content:"▾"; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
.persona-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.persona{
  border:1px solid var(--border); border-radius:15px; padding:15px 10px; text-align:center; cursor:pointer; transition:all .16s; background:var(--bg2);
}
.persona:hover{ border-color:var(--border2); }
.persona.on{ border-color:rgba(139,92,246,.6); background:var(--accent-soft); }
.persona .p-emoji{ font-size:1.5rem; }
.persona .p-name{ font-weight:700; font-size:.83rem; margin-top:6px; }
.persona .p-desc{ font-size:.68rem; color:var(--muted); margin-top:2px; }

/* ---------- Pricing ---------- */
.plan-card{ border:1px solid var(--border); border-radius:22px; padding:24px; background:var(--card); display:flex; flex-direction:column; gap:14px; position:relative; }
.plan-card.pro{ border-color:rgba(139,92,246,.55); background:
  radial-gradient(400px 200px at 50% -20%, rgba(139,92,246,.2), transparent 70%), var(--card); }
.plan-card .p-name{ font-size:1.05rem; font-weight:800; }
.plan-price{ display:flex; align-items:baseline; gap:6px; }
.plan-price .amt{ font-size:2.1rem; font-weight:800; letter-spacing:-.02em; }
.plan-price .per{ color:var(--muted); font-size:.82rem; }
.feat{ display:flex; gap:9px; font-size:.85rem; align-items:flex-start; }
.feat svg{ width:15px; height:15px; color:var(--good); flex:0 0 15px; margin-top:2px; }
.feat.no{ color:var(--faint); }
.feat.no svg{ color:var(--faint); }
.rec-badge{ position:absolute; top:-11px; left:50%; transform:translateX(-50%); }

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,5,12,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  z-index:200; display:grid; place-items:center; padding:18px; animation:fadeUp .2s ease both; overflow-y:auto;
}
.modal{
  width:100%; max-width:540px; background:var(--card); border:1px solid var(--border2); border-radius:24px;
  padding:26px; box-shadow:var(--shadow); animation:popIn .28s cubic-bezier(.2,.9,.3,1.2) both; max-height:92vh; overflow-y:auto; margin:auto;
}
.modal.wide{ max-width:660px; }
.modal h3{ font-size:1.2rem; font-weight:800; }
.modal .m-sub{ color:var(--muted); font-size:.84rem; margin:4px 0 16px; }
.m-close{ position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.06); display:grid; place-items:center; color:var(--muted); }
.m-close:hover{ background:rgba(255,255,255,.12); color:var(--text); }
.m-close svg{ width:15px; height:15px; }
.modal .m-head{ position:relative; margin-bottom:10px; padding-right:40px; }
.emoji-row{ display:flex; justify-content:space-between; gap:6px; }
.emoji-btn{ font-size:1.9rem; padding:8px 6px; border-radius:14px; border:2px solid transparent; transition:all .15s; background:rgba(255,255,255,.03); flex:1; }
.emoji-btn:hover{ transform:translateY(-2px); }
.emoji-btn.on{ border-color:var(--accent); background:var(--accent-soft); transform:translateY(-2px); }

/* ---------- Toast / confetti / breathe ---------- */
#toastRoot{ position:fixed; top:18px; right:18px; z-index:400; display:flex; flex-direction:column; gap:9px; max-width:min(360px, calc(100vw - 36px)); }
.toast{
  display:flex; gap:10px; align-items:flex-start; padding:13px 16px; border-radius:15px; background:#1b1b2c;
  border:1px solid var(--border2); box-shadow:var(--shadow); font-size:.85rem; font-weight:550; animation:popIn .25s ease both;
}
.toast .t-emoji{ font-size:1.05rem; }
.toast.success{ border-color:rgba(52,211,153,.45); } .toast.warn{ border-color:rgba(251,191,36,.45); } .toast.info{ border-color:rgba(139,92,246,.5); }
#confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:500; }
.breathe-overlay{ position:fixed; inset:0; z-index:300; background:rgba(7,7,14,.94); backdrop-filter:blur(8px); display:grid; place-items:center; animation:fadeUp .25s ease both; }
.breathe-box{ text-align:center; }
.b-circle{
  width:230px; height:230px; border-radius:50%; margin:0 auto 26px;
  background:radial-gradient(circle at 50% 40%, rgba(139,92,246,.4), rgba(99,102,241,.12) 65%, transparent 72%);
  border:2px solid rgba(139,92,246,.5); display:grid; place-items:center; transform:scale(.72);
}
.b-phase{ font-size:1.35rem; font-weight:800; letter-spacing:.04em; }
.b-count{ font-size:3rem; font-weight:800; font-variant-numeric:tabular-nums; color:#c4b0ff; }
.b-cycles{ color:var(--muted); font-size:.8rem; margin-top:8px; }

/* ---------- Light theme ---------- */
html[data-theme="light"]{
  --bg:#f4f3fb; --bg2:#eceaf7;

/* ---------- Accessibility variants ---------- */
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after{ animation:none!important; transition:none!important; }
/* High Contrast — adapts to the current theme (never flips your theme) */

body.cb{ --accent:#4f8cff; --accent2:#f59e0b; --accent-soft:rgba(79,140,255,.16); --good:#4f8cff; --bad:#f59e0b; --warn:#f59e0b;
  --grad:linear-gradient(135deg,#4f8cff,#2f6fe0); }
body.sr :focus-visible{ outline:3px solid var(--warn); }

/* ---------- Responsive ---------- */
@media (max-width:1020px){
  .g4{ grid-template-columns:repeat(2,1fr); }

  .g23, .g32{ grid-template-columns:1fr; }

}
@media (max-width:900px){

  .backdrop{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:55; opacity:0; pointer-events:none; transition:opacity .25s; }

   Single-file demo app. All data stays on your device (localStorage when
   available, in-memory otherwise). Rule-based emotion-aware AI, no network
   calls required. */

/* ---------------- Storage (sandbox-safe) ---------------- */
const storage = (() => {
  const mem = {}; let ok = false;
  try { localStorage.setItem('__nn_t','1'); localStorage.removeItem('__nn_t'); ok = true; } catch(e){}
  return {
    get(k, d){ if (ok) { try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch(e){} } return (k in mem) ? mem[k] : d; },
    set(k, v){ mem[k] = v; if (ok) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } },
    clear(){ mem.__wipe = 1; if (ok) { try { localStorage.removeItem('neuronest_v1'); } catch(e){} } }
  };
})();

/* ---------------- Utils ---------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const INR = n => '₹' + Number(n).toLocaleString('en-IN');
const fmtN = n => Number(n).toLocaleString('en-IN');

function dayName(iso, short=true){ return new Date(iso+'T12:00:00').toLocaleDateString('en-IN', { weekday: short?'short':'long' }); }
function niceDate(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short' }); }
function relDays(iso){ const diff = Math.round((new Date(todayISO()+'T12:00:00') - new Date(iso+'T12:00:00'))/86400000); if(diff<=0) return 'today'; if(diff===1) return 'yesterday'; return diff+'d ago'; }
function nowTime(){ const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function uid(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

const I = {

/* ---------------- Confetti ---------------- */
function confetti(){
  if (S.settings.reducedMotion) return;
  const cv = $('#confettiCanvas'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#8b5cf6','#6366f1','#34d399','#fbbf24','#f87171','#38bdf8'];
  const parts = Array.from({length:90}, () => ({
    x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*0.4,
    r: 4 + Math.random()*5, c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2.6 + Math.random()*3.4, vx: -1.6 + Math.random()*3.2, rot: Math.random()*Math.PI, vr: -.12 + Math.random()*.24
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.62); ctx.restore(); });
    if (++frames < 130) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------------- Metrics engine ---------------- */
function lastNDaysMood(n){ // oldest -> newest, includes today if logged
  const out = [];
  for (let i=n-1;i>=0;i--){ const iso = addDaysISO(todayISO(), -i); const m = S.moodLogs.find(x=>x.date===iso); if (m) out.push(m); }
  return out;
}
function metrics(){
  const week = lastNDaysMood(7);
  const moodAvg = avg(week.map(m=>m.mood));
  const sleepAvg = avg(week.map(m=>m.sleep));
  const stressPct = clamp(Math.round(avg(week.map(m=>m.stress))/5*100), 0, 100);
  const sleepDebt = +week.reduce((a,m)=>a+Math.max(0, 8-m.sleep), 0).toFixed(1);
  const focusThis = Object.entries(S.focusMinutes).filter(([d]) => d > addDaysISO(todayISO(),-7) && d <= todayISO()).reduce((a,[,v])=>a+v,0);
  const focusPrev = Object.entries(S.focusMinutes).filter(([d]) => d > addDaysISO(todayISO(),-14) && d <= addDaysISO(todayISO(),-7)).reduce((a,[,v])=>a+v,0);
  const overwork = clamp(Math.round(focusThis/7/240*100), 0, 100);
  const burnout = clamp(Math.round(stressPct*0.45 + clamp((8-sleepAvg)/8,0,1)*100*0.3 + overwork*0.25), 0, 100);
  const recovery = clamp(Math.round(moodAvg/5*45 + clamp(sleepAvg/8,0,1)*35 + (1-stressPct/100)*20), 0, 100);
  const vitality = clamp(Math.round(recovery*0.72 + (100-burnout)*0.18 + Math.min(S.streak,10)*1.0), 0, 100);
  return { moodAvg, sleepAvg, stressPct, sleepDebt, focusThis, focusPrev, burnout, recovery, vitality };
}
const lvl = (v, low, mid, rev=false) => { const s = v < low ? (rev?'High':'Low') : v < mid ? 'Moderate' : (rev?'Low':'High'); return s; };
function statusColor(v, low, mid, rev){ const s = lvl(v, low, mid, rev); return s==='Low' ? 'var(--good)' : s==='Moderate' ? 'var(--warn)' : 'var(--bad)'; }
function ringSVG(pct, size=118, stroke=11, color='url(#ringGrad)', centerHTML=''){
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-clamp(pct,0,100)/100);
  return '<div class="gauge" style="width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+TRACK()+'" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div class="g-label">'+centerHTML+'</div></div>';
}

function svgLine(vals, labels, min, max, color='#a78bfa'){
  const w=340, h=150, pl=10, pr=10, pt=16, pb=26;
  const iw = w-pl-pr, ih = h-pt-pb;
  const X = i => pl + (vals.length===1 ? iw/2 : i*iw/(vals.length-1));
  const Y = v => pt + (1-(clamp(v,min,max)-min)/(max-min))*ih;
  let path = '', area = '';
  vals.forEach((v,i) => { path += (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; });
  area = path + 'L' + X(vals.length-1).toFixed(1) + ' ' + (pt+ih) + ' L' + X(0).toFixed(1) + ' ' + (pt+ih) + ' Z';
  const dots = vals.map((v,i) => '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4" fill="'+color+'" stroke="'+(isLight()?'#ffffff':'#12121e')+'" stroke-width="2"><title>'+labels[i]+': '+v+'</title></circle>').join('');
  const xlabels = labels.map((l,i) => '<text x="'+X(i).toFixed(1)+'" y="'+(h-8)+'" font-size="9.5" fill="'+chartInk()+'" text-anchor="middle">'+l+'</text>').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img">'+
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".3"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#ag)"/>'+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots + xlabels + '</svg>';
}
function svgBars(vals, labels, opts){
  opts = opts || {};
  const goal = opts.goal || null, unit = opts.unit || '', color = opts.color || '#8b5cf6';
  const w=340, h=150, pl=10, pr=10, pt=14, pb=26;
  const iw = w-pl-pr, ih = h-pt-pb;
  const max = opts.maxOverride || Math.max(...vals, goal||0) * 1.15 || 1;
  const bw = Math.min(30, iw/vals.length*0.55);
  const bars = vals.map((v,i) => {
    const x = pl + (i+0.5)*iw/vals.length - bw/2, bh = clamp(v/max,0,1)*ih, y = pt+ih-bh;
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="5" fill="'+color+'" opacity="'+(v?'.92':'.25')+'"><title>'+labels[i]+': '+v+unit+'</title></rect>';
  }).join('');
  const xlabels = labels.map((l,i) => '<text x="'+(pl+(i+0.5)*iw/vals.length).toFixed(1)+'" y="'+(h-8)+'" font-size="9.5" fill="'+chartInk()+'" text-anchor="middle">'+l+'</text>').join('');
  const goalLine = goal ? '<line x1="'+pl+'" y1="'+(pt+ih-ih*goal/max).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+(pt+ih-ih*goal/max).toFixed(1)+'" stroke="'+(isLight()?'#059669':'#34d399')+'" stroke-width="1.6" stroke-dasharray="5 5"/><text x="'+(w-pr)+'" y="'+(pt+ih-ih*goal/max-4).toFixed(1)+'" font-size="9" fill="'+(isLight()?'#059669':'#34d399')+'" text-anchor="end">goal '+goal+unit+'</text>' : '';
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img">'+bars+goalLine+xlabels+'</svg>';
}

      '<div class="card"><div class="card-title">'+I.grid+' Productivity Heatmap</div><p class="card-sub">When your brain is switched on</p>'+heat+
        '<div class="row mt" style="justify-content:flex-end"><span class="legend">Less <i style="background:rgba(139,92,246,.1)"></i><i style="background:rgba(139,92,246,.35)"></i><i style="background:rgba(139,92,246,.6)"></i><i style="background:rgba(139,92,246,.9)"></i> More</span></div></div>'+

        '<p class="tiny muted">The more you check in and chat, the smarter this gets.</p></div></div>'+

}
function weeklyInsights(M, week){
  const out = [];
  if (M.focusPrev) { const d = Math.round((M.focusThis-M.focusPrev)/M.focusPrev*100);
    out.push(d >= 0 ? ['📈','Productivity up <b>+'+d+'%</b> compared to last week. Streak consistency is the key.'] : ['📉','Productivity down <b>'+d+'%</b> vs last week — one short focus session today restarts the trend.']); }
  out.push(['🎯','Your focus peaks between <b>9–11 AM</b>. Schedule deep work during this window.']);
  const worst = [...week].sort((a,b)=>a.mood-b.mood)[0];
  if (worst && worst.mood <= 3) out.push(['🌙','Mood dipped on <b>'+dayName(worst.date,false)+'</b> — possibly linked to '+worst.sleep+'h sleep. Consider a 30-min earlier bedtime.']);
  if (M.sleepAvg < 7) out.push(['😴','You averaged <b>'+M.sleepAvg.toFixed(1)+'h</b> sleep ('+(8-M.sleepAvg).toFixed(1)+'h below goal). Sleep is the cheapest performance upgrade you have.']);
  if (M.stressPct >= 55) out.push(['🫁','Stress averaged <b>'+M.stressPct+'%</b> this week. Micro-recovery (breathing, short walks) beats waiting for the weekend.']);
  return out.slice(0,5);
}

function chime(){
  try {
    const ctx = audioCtx();
    [523.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.18);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + i*0.18 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.18 + 0.9);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i*0.18); o.stop(ctx.currentTime + i*0.18 + 1);
    });
  } catch(e){}
}
/* ---- WebAudio soundscapes ---- */
function audioCtx(){
  if (!SOUND.ctx) SOUND.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (SOUND.ctx.state === 'suspended') SOUND.ctx.resume();
  if (!SOUND.master){ SOUND.master = SOUND.ctx.createGain(); SOUND.master.gain.value = 0.65; SOUND.master.connect(SOUND.ctx.destination); }
  return SOUND.ctx;
}
function noiseBuffer(ctx, seconds=2, type='white'){
  const len = ctx.sampleRate * seconds;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  if (type === 'brown'){ let last = 0; for (let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.5; } }
  else { for (let i=0;i<len;i++) d[i] = Math.random()*2-1; }
  return buf;
}
function stopSound(){
  SOUND.stopFns.forEach(fn => { try { fn(); } catch(e){} });
  SOUND.stopFns = [];
  SOUND.current = 'silence';
  $$('#soundGrid .sound-chip').forEach(c => c.classList.toggle('on', c.dataset.sound === 'silence'));
}
function playSound(name){
  stopSound();
  SOUND.current = name;
  $$('#soundGrid .sound-chip').forEach(c => c.classList.toggle('on', c.dataset.sound === name));
  if (name === 'silence') return;
  try {
    const ctx = audioCtx();
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 3, name==='ocean' ? 'brown' : 'white');
    src.loop = true;
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    if (name === 'rain'){ filter.type='lowpass'; filter.frequency.value=1400; gain.gain.value=0.16; }
    if (name === 'ocean'){ filter.type='lowpass'; filter.frequency.value=520; gain.gain.value=0.0;
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value=0.09; lg.gain.value=0.11;
      lfo.connect(lg); lg.connect(gain.gain); gain.gain.value=0.12; lfo.start();
      SOUND.stopFns.push(()=>{ lfo.stop(); });
    }
    if (name === 'forest'){ filter.type='lowpass'; filter.frequency.value=800; gain.gain.value=0.035; }
    src.connect(filter); filter.connect(gain); gain.connect(SOUND.master);
    src.start();
    SOUND.stopFns.push(()=>{ try{ src.stop(); }catch(e){} });
    if (name === 'forest'){
      const chirp = () => {
        if (SOUND.current !== 'forest') return;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type='sine';
        const base = 2200 + Math.random()*1600;
        o.frequency.setValueAtTime(base, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(base*1.4, ctx.currentTime+0.09);
        o.frequency.exponentialRampToValueAtTime(base*0.9, ctx.currentTime+0.18);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.22);
        o.connect(g); g.connect(SOUND.master);
        o.start(); o.stop(ctx.currentTime+0.25);
      };
      const iv = setInterval(()=>{ if (SOUND.current==='forest') { chirp(); setTimeout(chirp, 180); } }, 4200);
      SOUND.stopFns.push(()=> clearInterval(iv));
    }
    if (name === 'lofi'){
      const chords = [[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,349.23],[164.81,196,246.94,293.66]];
      let idx = 0;
      const playChord = () => {
        if (SOUND.current !== 'lofi') return;
        const freqs = chords[idx % chords.length]; idx++;
        freqs.forEach(f => {
          const o = ctx.createOscillator(), g = ctx.createGain(), flt = ctx.createBiquadFilter();
          o.type='triangle'; o.frequency.value=f;
          flt.type='lowpass'; flt.frequency.value=700;
          g.gain.setValueAtTime(0.0001, ctx.currentTime);
          g.gain.linearRampToValueAtTime(0.028, ctx.currentTime+0.6);
          g.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+3.8);
          o.connect(flt); flt.connect(g); g.connect(SOUND.master);
          o.start(); o.stop(ctx.currentTime+4);
        });
      };
      playChord();
      const iv = setInterval(playChord, 4000);
      SOUND.stopFns.push(()=> clearInterval(iv));
    }
  } catch(e){ toast('Audio not available in this preview — try the downloaded file.', 'warn'); }

/* ---- Memory Matrix ---- */
function openMemory(){
  GAME = { type:'memory', level: S.gameLevels.memory, lives: 3, pattern: [], picked: [], lock: true };
  gameShell('Memory Matrix','Watch the pattern, then replicate it — Level '+GAME.level);
  mmRound();
}
function mmRound(){
  if (!GAME || GAME.type !== 'memory') return;
  const area = $('#gameArea'); if (!area) return;
  const n = clamp(3 + Math.floor(GAME.level/2), 3, 6);
  const tiles = clamp(GAME.level + 2, 4, 12);
  GAME.pattern = Array.from({length:tiles}, () => Math.floor(Math.random()*n*n));
  GAME.pattern = [...new Set(GAME.pattern)];
  while (GAME.pattern.length < Math.min(tiles, n*n)) { const c = Math.floor(Math.random()*n*n); if (!GAME.pattern.includes(c)) GAME.pattern.push(c); }
  GAME.picked = []; GAME.lock = true;
  area.innerHTML = '<div class="mm-grid" style="grid-template-columns:repeat('+n+',1fr)">'+
    Array.from({length:n*n}, (_,i) => '<button class="mm-tile" data-mm="'+i+'" aria-label="tile"></button>').join('')+'</div>';
  gameMeta('Level '+GAME.level+' · '+GAME.pattern.length+' tiles · ❤️'.repeat(GAME.lives));
  const flashMs = 650 + GAME.pattern.length*160;
  GAME.pattern.forEach((p, i) => setTimeout(() => { if (!GAME || GAME.type!=='memory') return; const el = $('[data-mm="'+p+'"]'); if (el){ el.classList.add('lit'); } }, 320 + i*(flashMs/GAME.pattern.length)*0.7));
  setTimeout(() => { if (!GAME || GAME.type!=='memory') return; $$('#gameArea .mm-tile').forEach(t => t.classList.remove('lit')); GAME.lock = false; }, 320 + flashMs + 260);
}
function mmClick(el){
  if (!GAME || GAME.lock) return;
  const idx = +el.dataset.mm;
  if (GAME.picked.includes(idx)) return;
  if (GAME.pattern.includes(idx)){
    GAME.picked.push(idx); el.classList.add('ok');
    if (GAME.picked.length === GAME.pattern.length){
      GAME.lock = true;
      const xp = GAME.level*20;
      S.gameLevels.memory = ++GAME.level; S.gameXP.memory += xp;
      S.brainScore += 12; S.exercisesDone++; addXP(xp, 'Memory Matrix level up'); save();
      gameMeta('Perfect! Level '+(GAME.level-1)+' cleared · +'+xp+' XP');
      confetti();
      setTimeout(mmRound, 1100);
    }
  } else {
    el.classList.add('bad'); GAME.lock = true; GAME.lives--;
    if (GAME.lives <= 0){
      S.exercisesDone++; save();
      gameMeta('Out of lives — level '+GAME.level+' stays. So close!');
      setTimeout(() => { if (GAME) closeGame(); }, 1600);
    } else {
      gameMeta('Miss! ❤️'.repeat(GAME.lives)+' — watch again…');
      setTimeout(mmRound, 1100);
    }
  }
}

function lcDraw(){

function lcAnswer(i){
  const item = GAME.order[GAME.q];

    buttons[i].classList.add('right'); GAME.correct++;
    $('#lcWhy').textContent = '✅ ' + item.why;

    buttons[i].classList.add('wrong');

  }
  GAME.q++;
  setTimeout(() => { if (GAME && GAME.type==='logic' && GAME.q < GAME.order.length) lcDraw(); else if (GAME && GAME.type==='logic') lcEnd(); }, 1500);

/* ================= PREVENTIVE AI ================= */
function buildAlerts(M){
  const alerts = [];
  const week = lastNDaysMood(7);
  const recent = week.slice(-3);
  if (recent.length === 3 && avg(recent.map(m=>m.stress)) > avg(week.map(m=>m.stress)) + 0.4)
    alerts.push({ sev:'red', time:'today', title:'Elevated Stress Pattern', body:'Your stress markers have been above baseline for 3 consecutive days. Consider a recovery day — your future self will thank you.' });
  const sleepPrev = avg(week.slice(0,3).map(m=>m.sleep));
  if (sleepPrev && M.sleepAvg < sleepPrev - 0.6)
    alerts.push({ sev:'amber', time:'yesterday', title:'Sleep Quality Declining', body:'Average sleep dropped '+Math.round((sleepPrev-M.sleepAvg)/sleepPrev*100)+'% this week. Reducing screen time before bed may help.' });
  const yst = S.focusMinutes[addDaysISO(todayISO(),-1)] || 0;
  if (yst > 60 && M.recovery >= 55)
    alerts.push({ sev:'green', time:'yesterday', title:'Recovery Trend Positive', body:'Your recovery metrics are improving after yesterday\u2019s focus sessions. Whatever you changed — keep it.' });
  if (!todayLog())
    alerts.push({ sev:'amber', time:'today', title:'Check-in Reminder', body:'You haven\u2019t logged today\u2019s check-in yet. 20 seconds now makes your weekly insights much sharper.' });
  if (M.sleepDebt >= 5)
    alerts.push({ sev:'amber', time:'this week', title:'Sleep Debt Building', body:'You\u2019ve accumulated '+M.sleepDebt+'h of sleep debt this week. A consistent bedtime repays it faster than sleeping in.' });
  if (alerts.length < 2)
    alerts.push({ sev:'green', time:'this week', title:'Steady State', body:'No warning signs detected. Your mood and stress are holding stable — keep the check-ins going.' });
  return alerts;
}
function renderPreventive(){
  const M = metrics();
  const alerts = buildAlerts(M);
  const gauges = [
    { title:'Burnout Risk', val:M.burnout, suffix:'%', status:lvl(M.burnout,33,66,true), color:statusColor(M.burnout,33,66,true) },
    { title:'Stress Level', val:M.stressPct, suffix:'%', status:lvl(M.stressPct,33,66,true), color:statusColor(M.stressPct,33,66,true) },
    { title:'Sleep Debt', val:M.sleepDebt, suffix:' hrs', status:M.sleepDebt<3?'Good':M.sleepDebt<6?'Watch':'High', color:M.sleepDebt<3?'var(--good)':M.sleepDebt<6?'var(--warn)':'var(--bad)' },
    { title:'Recovery Score', val:M.recovery, suffix:'%', status:lvl(M.recovery,40,66), color:statusColor(M.recovery,40,66) }
  ];
  const rec = alerts.find(a => a.sev !== 'green') || alerts[0];
  $('#page-preventive').innerHTML =
    '<div class="grid g4">'+
      gauges.map(g => '<div class="card gauge-card">'+
        ringSVG(g.val, 118, 11, g.color, '<div class="stat-num" style="font-size:1.5rem">'+g.val+g.suffix+'</div>')+
        '<div class="g-title">'+g.title+'</div><div class="g-status" style="color:'+g.color+'">'+g.status.toUpperCase()+'</div></div>').join('')+
    '</div>'+
    '<div class="grid g23 mt">'+
      '<div class="card"><div class="card-title">'+I.shield+' AI Health Alerts</div><p class="card-sub">Early warnings from your mood, sleep & focus data</p>'+
        '<div class="stack">'+alerts.map(a =>
          '<div class="alert-item"><span class="a-dot" style="background:'+(a.sev==='red'?'var(--bad)':a.sev==='amber'?'var(--warn)':'var(--good)')+'"></span>'+
          '<div style="flex:1"><b>'+a.title+'</b> <span class="tiny muted">· '+a.time+'</span><div class="small muted" style="margin-top:2px">'+a.body+'</div></div></div>').join('')+
        '</div></div>'+
      '<div class="stack" style="gap:16px">'+
        '<div class="card" style="border-color:rgba(139,92,246,.4)"><div class="card-title">'+I.spark+' This Week\u2019s Recommendation</div>'+
          '<p class="small" style="margin-top:6px">'+(rec.sev==='green' ? 'Keep doing what you\u2019re doing — your metrics are in a healthy range. Consistency &gt; intensity.' :
            rec.title.includes('Sleep') ? 'Protect your evenings: screens off 45 minutes before bed, cool dark room, same wake time. Aim for 7.5–8h tonight.' :
            rec.title.includes('Stress') || rec.title.includes('Check') ? 'Schedule micro-recovery today: one breathing cycle every 2 hours, a 15-minute walk after lunch, and one thing you genuinely enjoy.' :
            'Your body is asking for recovery. Take today easy — light movement, good food, early night. Rest is when adaptation happens.')+'</p></div>'+
        '<div class="card"><div class="card-title">📐 How these are calculated</div><p class="tiny muted" style="margin-top:6px">'+
          'Burnout risk blends stress check-ins (45%), sleep deficit (30%) and focus overload (25%). Recovery blends mood (45%), sleep (35%) and low stress (20%). '+
          'All from your last 7 days of check-ins and sessions — stored only on your device.</p></div>'+
      '</div>'+
    '</div>';
}

document.addEventListener('click', e => {
  // close modal when clicking the overlay itself
  if (e.target.dataset && e.target.dataset.overlay){ closeModal(); return; }
  if (e.target.dataset && e.target.dataset.breathe){ closeBreathe(); return; }
  // game tiles & booking chips (no data-action attribute needed)
  const tile = e.target.closest('[data-mm],[data-lc],[data-sp],[data-stroop],[data-bk-date],[data-bk-time],[data-bk-mode],#ftTarget,#ftArena');
  if (tile){
    if (tile.dataset.mm !== undefined){ mmClick(tile); return; }
    if (tile.dataset.lc !== undefined){ lcAnswer(+tile.dataset.lc); return; }
    if (tile.dataset.sp !== undefined){ spHit(tile.dataset.sp==='1', tile); return; }
    if (tile.dataset.stroop !== undefined){ stroopAnswer(tile.dataset.stroop); return; }
    if (tile.dataset.bkDate){ BOOKING.date = tile.dataset.bkDate; $$('#bk-dates .chip').forEach(c => c.classList.toggle('on', c.dataset.bkDate === tile.dataset.bkDate)); return; }
    if (tile.dataset.bkTime){ BOOKING.time = tile.dataset.bkTime; $$('#bk-times .chip').forEach(c => c.classList.toggle('on', c.dataset.bkTime === tile.dataset.bkTime)); return; }
    if (tile.dataset.bkMode){ BOOKING.mode = tile.dataset.bkMode; $$('#bk-modes button').forEach(b => b.classList.toggle('on', b.dataset.bkMode === tile.dataset.bkMode)); return; }
    if (tile.id === 'ftTarget'){ if (GAME && GAME.type==='focusG' && GAME.running){ GAME.hits++; const s = $('#ftScore'); if (s) s.textContent = 'Hits: '+GAME.hits+' · Misses: '+GAME.misses; } return; }
    if (tile.id === 'ftArena'){ if (GAME && GAME.type==='focusG' && GAME.running){ GAME.misses++; const s = $('#ftScore'); if (s) s.textContent = 'Hits: '+GAME.hits+' · Misses: '+GAME.misses; } return; }
  }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input;
  if (!k) return;
  if (k === 'ckEnergy'){ CHECKIN.energy = +e.target.value; const v = $('#ck-energy-v'); if (v) v.textContent = e.target.value+'/5'; }
  if (k === 'ckStress'){ CHECKIN.stress = +e.target.value; const v = $('#ck-stress-v'); if (v) v.textContent = e.target.value+'/5'; }
  if (k === 'volume'){ if (SOUND.master) SOUND.master.gain.value = e.target.value/100; }
  if (k === 'ndToggle'){
    S.settings[e.target.dataset.key] = e.target.checked; applyA11y(); rerenderCurrent();
    const meta = ND.find(n => n.key === e.target.dataset.key);
    if (meta) toast(meta.title + (e.target.checked ? ' on' : ' off'), 'info', 1500);
  }
  if (k === 'setLanguage'){ S.settings.language = e.target.value; save(); buildSidebar(); refreshHUD(); go(currentPage); toast('Language updated 🌏','success'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (BREATHE) closeBreathe();
    else if (GAME) closeGame();
    else closeModal();
  }
});
window.addEventListener('resize', () => { const cv = $('#confettiCanvas'); cv.width = innerWidth; cv.height = innerHeight; });

function init(){
  buildSidebar();
  applyA11y();
  applyTheme();
  refreshHUD();
  go('dashboard');
}
init();
</script>
</body>
</html>
